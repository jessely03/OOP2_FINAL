<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f0">
  <title>NaviGo | Trip planner</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="#welcome"><span class="logo">✦</span>NaviGo<span class="brand-dot">.</span></a>
      <nav id="navigation" aria-label="Main navigation"></nav>
      <div class="sidebar-note"><span class="small-compass">✦</span><div><strong>NaviGo planner</strong><small>Local demo workspace</small></div></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div id="breadcrumb" class="breadcrumb"></div>
        <label class="trip-switch"><span>Trip</span><select id="trip-select" aria-label="Active trip"></select></label>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <dialog id="trip-dialog">
    <form id="trip-form">
      <div class="section-head"><h2>Create a trip</h2><button class="icon-button" type="button" data-close aria-label="Close">×</button></div>
      <label>Trip name<input name="name" required maxlength="60" placeholder="e.g. Taiwan Trip"></label>
      <label>Destination<input name="destination" required maxlength="60" placeholder="e.g. Taipei, Taiwan"></label>
      <div class="form-grid">
        <label>Start date<input name="start" type="date" required></label>
        <label>End date<input name="end" type="date" required></label>
      </div>
      <button class="button primary" type="submit">Create trip</button>
    </form>
  </dialog>
  <dialog id="activity-dialog">
    <form id="activity-form">
      <div class="section-head"><h2 id="activity-heading">Add activity</h2><button class="icon-button" type="button" data-close aria-label="Close">×</button></div>
      <label>Activity<input name="name" required maxlength="70" placeholder="e.g. Dinner at Taipei 101"></label>
      <label>Location<input name="location" required maxlength="70" placeholder="e.g. Xinyi District"></label>
      <div class="form-grid">
        <label>Date<input name="date" type="date" required></label>
        <label>Time<input name="time" type="time" required></label>
      </div>
      <label>Category<select name="category"><option>Explore</option><option>Transit</option><option>Food</option></select></label>
      <div class="form-actions"><button class="button danger" type="button" id="delete-activity" hidden>Remove</button><button class="button primary" type="submit">Save activity</button></div>
    </form>
  </dialog>
  <div id="status" class="status" role="status"></div>
</body>
</html>
